name: Build & Deploy to ECI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-eci:
    runs-on: ubuntu-latest
    env:
      REGION: cn-hangzhou
      CONTAINER_GROUP_NAME: spring-demo-eci
      CONTAINER_NAME: spring-demo
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      VSWITCH_ID: vsw-bp1v4f5qn6pi4g1inn85z
      SECURITY_GROUP_ID: sg-bp1fyc1lq2nbzqo2xtxt

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install aliyun CLI
        env:
          ALIYUN_CLI_VERSION: 3.4.5
        run: |
          set -e
          URL="https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz"
          curl -fsSL --retry 3 -o /tmp/aliyun.tgz "$URL"
          tar -xzf /tmp/aliyun.tgz -C /tmp/
          install /tmp/aliyun /usr/local/bin/aliyun
          aliyun --version

      - name: Install aliyun-cli-eci plugin
        run: aliyun plugin install --name aliyun-cli-eci

      - name: Configure aliyun CLI
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          aliyun configure set \
            --mode AK --region "$REGION" \
            --access-key-id "$ALIYUN_AK" \
            --access-key-secret "$ALIYUN_SK"

      - name: Delete any previous ECI with this name
        run: |
          IDS=$(aliyun eci describe-container-groups \
            --biz-region-id "$REGION" \
            --container-group-name "$CONTAINER_GROUP_NAME" \
            --limit 20 2>/dev/null \
            | jq -r '.ContainerGroups[]?.ContainerGroupId // empty')
          for id in $IDS; do
            [ -z "$id" ] && continue
            echo "Deleting existing ECI $id"
            aliyun eci delete-container-group \
              --biz-region-id "$REGION" \
              --container-group-id "$id" \
              --biz-force true || true
          done

      - name: Create ECI
        run: |
          # Memory/CPU constrained to 512MB/1.0 because cn-hangzhou-f (the
          # only zone this VPC's VSwitch is in) is currently out of stock
          # for ≥1024MB ECI resource classes. To use more, add a second
          # VSwitch in another zone and pass both IDs to --vswitch-id;
          # ECI will then multi-zone schedule.
          #
          # compute-category=economy is critical: the default general-purpose
          # category rounds a 1 vCPU / 512 MB request up to a 64 vCPU /
          # 512 MB instance (~¥22/hr), which surprised the first deploy
          # with a ¥110 bill. economy has real 1 vCPU instance types
          # (~¥0.05/hr).
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          CONTAINER=$(cat <<EOF
          [{
            "Name":"$CONTAINER_NAME",
            "Image":"$IMAGE",
            "Memory":512.0,
            "Cpu":1.0,
            "Port":[{"Port":8080,"Protocol":"TCP"}]
          }]
          EOF
          )
          aliyun eci create-container-group \
            --biz-region-id "$REGION" \
            --container-group-name "$CONTAINER_GROUP_NAME" \
            --compute-category economy \
            --container "$CONTAINER" \
            --vswitch-id "$VSWITCH_ID" \
            --security-group-id "$SECURITY_GROUP_ID" \
            --auto-create-eip true \
            --eip-bandwidth 5 \
            --eip-isp BGP \
            --restart-policy OnFailure

      - name: Wait for Running and smoke test
        run: |
          IP=""
          for i in $(seq 1 60); do
            RESP=$(aliyun eci describe-container-groups \
              --biz-region-id "$REGION" \
              --container-group-name "$CONTAINER_GROUP_NAME" 2>/dev/null)
            STATUS=$(echo "$RESP" | jq -r '.ContainerGroups[0].Status // empty' 2>/dev/null)
            IP=$(echo "$RESP" | jq -r '.ContainerGroups[0].InternetIp // empty' 2>/dev/null)
            echo "[$((i*10))s] status=$STATUS ip=$IP"
            if [ "$STATUS" = "Running" ] && [ -n "$IP" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "ECI never got an EIP; last response:"
            echo "$RESP"
            exit 1
          fi
          echo "ECI $CONTAINER_GROUP_NAME is Running at http://$IP:8080"
          echo "==="
          curl -sS -w "\nHTTP=%{http_code} time=%{time_total}s\n" \
            "http://$IP:8080/" --max-time 30 || true
          curl -sS -w "\nHTTP=%{http_code} time=%{time_total}s\n" \
            "http://$IP:8080/hello?name=eci-github-actions" --max-time 30 || true

      - name: Clean up ECI to stop billing
        if: always()
        run: |
          # Always delete the ECI after the workflow finishes, including
          # on failure — otherwise restart-policy=OnFailure won't restart
          # it (since smoke test always exits 0 via || true), and the
          # ECI would sit Running, racking up cost until manual cleanup.
          # OnFailure keeps the container alive if Spring Boot crashes,
          # which is the right CI behavior; cleanup here guarantees
          # we never leave a paid instance running between deploys.
          IDS=$(aliyun eci describe-container-groups \
            --biz-region-id "$REGION" \
            --container-group-name "$CONTAINER_GROUP_NAME" \
            --limit 20 2>/dev/null \
            | jq -r '.ContainerGroups[]?.ContainerGroupId // empty')
          for id in $IDS; do
            [ -z "$id" ] && continue
            echo "Deleting ECI $id"
            aliyun eci delete-container-group \
              --biz-region-id "$REGION" \
              --container-group-id "$id" \
              --biz-force true || true
          done
