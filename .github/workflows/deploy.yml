name: Build & Deploy to FC3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGION: cn-hangzhou
      FUNCTION_NAME: spring-demo
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install aliyun CLI
        env:
          ALIYUN_CLI_VERSION: 3.4.5
        run: |
          set -e
          curl -fsSL -o /tmp/aliyun.tgz \
            "https://gh-proxy.com/https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz"
          tar -xzf /tmp/aliyun.tgz -C /tmp/
          install /tmp/aliyun /usr/local/bin/aliyun
          aliyun --version

      - name: Install aliyun-cli-fc plugin
        run: aliyun plugin install aliyun-cli-fc

      - name: Configure aliyun CLI (non-interactive)
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          aliyun configure set \
            --mode AK \
            --region "$REGION" \
            --access-key-id "$ALIYUN_AK" \
            --access-key-secret "$ALIYUN_SK"

      - name: Update FC3 function (custom-container image)
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          CONFIG="{\"image\":\"${IMAGE}\",\"port\":8080}"
          aliyun fc update-function \
            --region "$REGION" \
            --function-name "$FUNCTION_NAME" \
            --custom-container-config "$CONFIG"
