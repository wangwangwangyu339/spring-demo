name: Build & Deploy to FC3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGION: cn-hangzhou
      FUNCTION_NAME: spring-demo
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      MEMORY_MB: '1024'
      CPU: '1.0'
      DISK_MB: '512'
      TIMEOUT_S: '60'
      CONCURRENCY: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install aliyun CLI
        env:
          ALIYUN_CLI_VERSION: 3.4.5
        run: |
          set -e
          URL="https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz"
          echo "Downloading $URL"
          if ! curl -fsSL --retry 3 -o /tmp/aliyun.tgz "$URL"; then
            echo "Direct GitHub failed, falling back to gh-proxy.com"
            curl -fsSL --retry 3 -o /tmp/aliyun.tgz \
              "https://gh-proxy.com/$URL"
          fi
          tar -xzf /tmp/aliyun.tgz -C /tmp/
          install /tmp/aliyun /usr/local/bin/aliyun
          aliyun --version

      - name: Install aliyun-cli-fc plugin
        run: aliyun plugin install --name aliyun-cli-fc --version 0.5.1

      - name: Configure aliyun CLI (non-interactive)
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          aliyun configure set \
            --mode AK \
            --region "$REGION" \
            --access-key-id "$ALIYUN_AK" \
            --access-key-secret "$ALIYUN_SK"

      - name: Sync FC3 function (create on first run, update thereafter)
        run: |
          set -e
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          CONFIG="{\"image\":\"${IMAGE}\",\"port\":8080,\"accelerationType\":\"None\"}"

          echo "::group::Try create-function"
          CREATE_OUT=$(aliyun fc create-function \
            --region "$REGION" \
            --function-name "$FUNCTION_NAME" \
            --runtime custom-container \
            --handler "main" \
            --custom-container-config "$CONFIG" \
            --memory-size "$MEMORY_MB" \
            --cpu "$CPU" \
            --disk-size "$DISK_MB" \
            --timeout "$TIMEOUT_S" \
            --instance-concurrency "$CONCURRENCY" 2>&1) || CREATE_OUT+=" (exit=$?)"
          echo "$CREATE_OUT"

          if echo "$CREATE_OUT" | grep -qiE "already exists|FunctionAlreadyExists|InvalidArgument.*already"; then
            echo "::group::Function exists; running update-function"
            aliyun fc update-function \
              --region "$REGION" \
              --function-name "$FUNCTION_NAME" \
              --custom-container-config "$CONFIG"
            echo "::endgroup::"
          else
            echo "Function created (or non-conflict response)."
          fi
          echo "::endgroup::"
